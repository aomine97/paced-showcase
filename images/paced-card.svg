      <stop offset="0" stop-color="#0f3d2e"/>
      <stop offset="1" stop-color="#14614a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g opacity="0.07" stroke="#ffffff">
    <path d="M0 105H1200M0 210H1200M0 315H1200M0 420H1200M0 525H1200"/>
  </g>
  <rect x="80" y="70" width="40" height="40" rx="10" fill="#7ee2b8"/>
  <text x="100" y="98" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#0f3d2e">P</text>
  <text x="136" y="99" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff">paced</text>
  <text x="80" y="250" font-family="Georgia, 'Times New Roman', serif" font-size="66" fill="#ffffff">Know where your</text>
  <text x="80" y="330" font-family="Georgia, 'Times New Roman', serif" font-size="66" fill="#ffffff">money went.</text>
  <text x="80" y="395" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#cfeee0">Connect your bank once. Paced texts you a</text>
  <text x="80" y="428" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#cfeee0">plain-English summary of your spending.</text>
  <g font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#9fd8bf">
    <text x="80" y="540">Plaid · Supabase · Deno · React Native · Twilio</text>
  </g>
  <g transform="translate(760,90)">
    <rect width="340" height="450" rx="44" fill="#0b2a20" stroke="#2f8a69" stroke-width="3"/>
    <rect x="125" y="18" width="90" height="22" rx="11" fill="#000000"/>
    <text x="170" y="80" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#8fbfaa">Messages · Paced</text>
    <rect x="24" y="110" width="270" height="150" rx="20" fill="#e9f7f0"/>
    <g font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#123d2f">
      <text x="42" y="142" font-weight="700">This week: $412</text>
      <text x="42" y="170">Food $168 · Rides $74</text>
      <text x="42" y="196">Subscriptions $41</text>
      <text x="42" y="232" fill="#14614a" font-weight="700">$60 under your pace</text>
    </g>
    <rect x="110" y="282" width="184" height="46" rx="20" fill="#2fbf87"/>
    <text x="202" y="311" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#ffffff">what about food?</text>
    <rect x="24" y="346" width="230" height="70" rx="20" fill="#e9f7f0"/>
    <g font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#123d2f">
      <text x="42" y="375">Food is up 12% vs last</text>
      <text x="42" y="398">week. Mostly delivery.</text>
    </g>
